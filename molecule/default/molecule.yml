---
# Tests run on the Proxmox test lab: two real KVM VMs cloned from the lab
# fleet onto the isolated labnet network (EL release chosen by LAB_TEMPLATE),
# SELinux enforcing and firewalld running — the paths containers never could.
# converge.yml is a wrapper around the repo's own examples/playbook.yml; the
# pipeline comes from the inline group_vars below: a generator to stdout, so
# no Elasticsearch fixture is needed (the examples' es-output template is an
# example, not a default). Every address comes from gathered facts. All
# Proxmox connection details live in the driver's secrets file on the control
# machine. The driver's SSH lands as a sudo user; the plays' become: true
# runs the tasks privileged through it.
#
# Default VMIDs are the repo's 9305-9306 band, via LAB_VMID_0/1 so the lab's
# `mlab` runner can claim a free band per run and allow parallel runs of this
# repo; a plain molecule test uses the pinned band, one lab run at a time.
#
# Run on the lab's molecule control machine:
#   /root/labnet/mlab test -s default              # parallel-safe, recommended
#   molecule test                                  # pinned band
#   LAB_TEMPLATE=template-alma10 molecule test     # the other EL release
role_name_check: 1

dependency:
  name: galaxy
  enabled: false        # collections preinstalled on the control machine
prerun: false

driver:
  name: molecule-proxmox
  options:
    proxmox_secrets: ${LAB_PROXMOX_SECRETS:-/root/.config/molecule/proxmox-secrets.yml}
    node: ${LAB_NODE:-galactica}
    validate_certs: false   # the lab's PVE uses its self-signed cert
    ssh_user: ${LAB_SSH_USER:-labadmin}
    ssh_identity_file: ${LAB_SSH_KEY:-/root/.ssh/id_ed25519}
    full: ${LAB_FULL:-true}
    pool: ${LAB_POOL:-testlab}
    timeout: 300

platforms:
  - name: log-default-1
    template_name: ${LAB_TEMPLATE:-template-alma9}
    newid: ${LAB_VMID_0:-9305}
    groups: [logstash]
    memory: 3072

  - name: log-default-2
    template_name: ${LAB_TEMPLATE:-template-alma9}
    newid: ${LAB_VMID_1:-9306}
    groups: [logstash]
    memory: 3072

provisioner:
  name: ansible
  env:
    # The role under test resolves through the sibling role checkouts.
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/..:/root/.ansible/roles"
  inventory:
    group_vars:
      all:
        # The role's own logstash_version, as the other scenarios read it.
        test_default_version: >-
          {{ (lookup('ansible.builtin.file',
             lookup('env', 'MOLECULE_PROJECT_DIRECTORY') ~ '/defaults/main.yml')
             | from_yaml).logstash_version }}
      logstash:
        # No defaults from examples/: the repo's production inventory is an
        # example, this scenario keeps only the minimum that exercises the
        # pipeline, validation and restart machinery.
        logstash_pipelines:
          - id: molecule
            config: |
              input { generator { lines => ["hello molecule", "second event"] count => 5 } }
              filter { mutate { add_tag => ["molecule"] } }
              output { stdout { codec => rubydebug } }

verifier:
  name: ansible

scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy

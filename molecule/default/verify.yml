---
# VM-level checks: the service, the pipeline via Logstash's own API
# (127.0.0.1:9600, no TLS by default), the package version the role defaults
# promise, and a clean journal. No molecule-notest tags: everything must
# pass on a converged box.
- name: Verify Logstash
  hosts: logstash
  gather_facts: false
  become: true
  tasks:
    - name: Logstash is running and enabled
      ansible.builtin.systemd_service:
        name: logstash
        state: started
        enabled: true
      register: ls_service

    - name: The pipeline ran (events processed per Logstash's own stats)
      ansible.builtin.uri:
        url: http://127.0.0.1:9600/_node/stats/pipelines/molecule
      register: ls_stats
      until: ls_stats.json.pipelines.molecule.events.out | default(0) >= 10
      retries: 12
      delay: 5

    - name: The package is at the role's default version
      ansible.builtin.command: dnf -q list installed logstash
      register: ls_package
      changed_when: false
      failed_when: test_default_version not in ls_package.stdout

    - name: No errors in this boot's journal
      ansible.builtin.command: journalctl -u logstash -b --no-pager -o cat
      register: ls_journal
      changed_when: false
      failed_when: ls_journal.stdout is search('\[ERROR\]')

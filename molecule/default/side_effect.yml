---
# Runs after the idempotence check, on the converged pair. Each step applies
# the role with different settings and checks how the change was applied:
#   - a changed pipeline is reloaded on its own: same PID, only its reload
#     counter moves, and its events show the change;
#   - a pipeline added and then marked absent comes and goes by reload;
#   - an invalid pipeline is refused by validation: the run fails, the old
#     file stays and Logstash keeps running it;
#   - a JVM option change is applied by a rolling restart: new PIDs, and ls-1
#     is back up before ls-2 goes down.
# The final step restores the converge settings for check and verify.
- name: Record the state before any change
  hosts: logstash
  become: true
  gather_facts: false
  tasks:
    - name: Read the state
      ansible.builtin.include_tasks: tasks/read_state.yml

    - name: Remember it
      ansible.builtin.set_fact:
        test_before: "{{ test_state }}"

- name: Change one pipeline
  hosts: logstash
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Apply the role
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
      vars:
        test_ingest_revision: 2

    - name: Read the state
      ansible.builtin.include_tasks: tasks/read_state.yml

    - name: Check only ingest was reloaded, without a restart
      ansible.builtin.assert:
        that:
          - test_state.pid == test_before.pid
          - test_state.reloads.ingest > test_before.reloads.ingest
          - test_state.reloads.beats == test_before.reloads.beats
        fail_msg: "Before: {{ test_before }}, after: {{ test_state }}"

    - name: Send an event through the reloaded pipeline
      ansible.builtin.include_tasks: tasks/send_event.yml
      vars:
        test_message: side-effect-revision-2

    - name: Check the event went through the new version
      ansible.builtin.assert:
        that:
          - test_event.molecule.revision == '2'
        fail_msg: "{{ test_event | to_json }}"

    - name: Remember the state
      ansible.builtin.set_fact:
        test_before: "{{ test_state }}"

- name: Add a pipeline
  hosts: logstash
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Apply the role
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
      vars:
        logstash_pipelines: "{{ test_pipelines + [test_extra] }}"
        test_extra:
          id: extra
          config: 'input { pipeline { address => "molecule-extra" } }'
          templates: [molecule/file-output.conf.j2]

    - name: Read the state
      ansible.builtin.include_tasks: tasks/read_state.yml

    - name: Check the pipeline started without a restart
      ansible.builtin.assert:
        that:
          - test_state.pid == test_before.pid
          - test_state.reloads.keys() | sort == ['beats', 'extra', 'ingest']
        fail_msg: "Before: {{ test_before }}, after: {{ test_state }}"

- name: Mark the pipeline absent
  hosts: logstash
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Apply the role
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
      vars:
        logstash_pipelines: "{{ test_pipelines + [{'id': 'extra', 'state': 'absent'}] }}"

    - name: Check its file was removed
      ansible.builtin.stat:
        path: /etc/logstash/pipelines.d/extra.conf
      register: test_extra_file
      failed_when: test_extra_file.stat.exists

    - name: Read the state
      ansible.builtin.include_tasks: tasks/read_state.yml

    - name: Check the pipeline stopped without a restart
      ansible.builtin.assert:
        that:
          - test_state.pid == test_before.pid
          - test_state.reloads.keys() | sort == ['beats', 'ingest']
        fail_msg: "Before: {{ test_before }}, after: {{ test_state }}"

- name: Refuse an invalid pipeline
  hosts: logstash
  become: true
  gather_facts: false
  tasks:
    - name: Read the state
      ansible.builtin.include_tasks: tasks/read_state.yml

    - name: Remember it
      ansible.builtin.set_fact:
        test_before: "{{ test_state }}"

    - name: Checksum the current ingest pipeline
      ansible.builtin.stat:
        path: /etc/logstash/pipelines.d/ingest.conf
      register: test_ingest_before

    - name: Apply the role with a broken pipeline
      block:
        - name: Apply the role
          ansible.builtin.include_role:
            name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
          vars:
            logstash_pipelines: "{{ [test_pipelines[0] | combine({'config': 'input { http { port => 8080 } '})] + test_pipelines[1:] }}"

        - name: The role should have failed
          ansible.builtin.set_fact:
            test_refused: false

      rescue:
        - name: Record the refusal
          ansible.builtin.set_fact:
            test_refused: true
            test_refusal: >-
              {{ ansible_failed_result.results | default([ansible_failed_result])
                 | selectattr('failed', 'defined') | selectattr('failed') | map(attribute='msg') | join(' ') }}

    - name: Check validation refused it
      ansible.builtin.assert:
        that:
          - test_refused
          - test_refusal is search('failed to validate')
        fail_msg: "Refused: {{ test_refused }}; message: {{ test_refusal | default('') }}"

    - name: Checksum the ingest pipeline again
      ansible.builtin.stat:
        path: /etc/logstash/pipelines.d/ingest.conf
      register: test_ingest_after

    - name: Read the state
      ansible.builtin.include_tasks: tasks/read_state.yml

    - name: Check the old pipeline is still in place and running
      ansible.builtin.assert:
        that:
          - test_ingest_after.stat.checksum == test_ingest_before.stat.checksum
          - test_state.pid == test_before.pid
          - test_state.reloads == test_before.reloads
        fail_msg: "Before: {{ test_before }}, after: {{ test_state }}"

- name: Change a JVM option
  hosts: logstash
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Note the time
      ansible.builtin.command: date +%s
      register: test_start
      changed_when: false

    - name: Apply the role
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
      vars:
        logstash_jvm_options: [-Dmolecule.marker=restarted]

    - name: Check the rolling restart
      ansible.builtin.include_tasks: tasks/check_rolling_restart.yml

- name: Go back to the converge settings
  hosts: logstash
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Note the time
      ansible.builtin.command: date +%s
      register: test_start
      changed_when: false

    - name: Apply the role
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"

    - name: Check the rolling restart
      ansible.builtin.include_tasks: tasks/check_rolling_restart.yml

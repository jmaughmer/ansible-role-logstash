---
# Runs after the idempotence check. Each step applies the role and checks
# whether the fapolicyd trust entries were rewritten, from the trust file's
# modification time:
#   - unpinning the plugin with logstash_plugins_update updates it, and the
#     entries are rewritten before the pipeline that now uses it is validated
#     and Logstash restarts;
#   - the same run again updates nothing and leaves the entries alone;
#   - entries recorded for another package or plugin set, as after a change
#     made outside the role, get rewritten.
- name: Update the plugin
  hosts: logstash
  become: true
  gather_facts: false
  vars: &test_update_vars
    logstash_plugins:
      - name: "{{ test_plugin }}"
    logstash_plugins_update: true
    test_use_plugin: true
  tasks:
    - name: Read the trust file
      ansible.builtin.stat:
        path: /etc/fapolicyd/trust.d/ansible-logstash
      register: test_trust_before

    - name: Apply the role
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"

    - name: Read the trust file again
      ansible.builtin.stat:
        path: /etc/fapolicyd/trust.d/ansible-logstash
      register: test_trust_after

    - name: Check the entries were rewritten
      ansible.builtin.assert:
        that:
          - test_trust_after.stat.mtime > test_trust_before.stat.mtime

    # For the record: what logstash-plugin itself reported under fapolicyd
    - name: Show the update's output
      ansible.builtin.debug:
        var: _ls_plugin_updated.stdout_lines

- name: Update again with nothing new
  hosts: logstash
  become: true
  gather_facts: false
  vars: *test_update_vars
  tasks:
    - name: Read the trust file
      ansible.builtin.stat:
        path: /etc/fapolicyd/trust.d/ansible-logstash
      register: test_trust_before

    - name: Apply the role
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"

    - name: Read the trust file again
      ansible.builtin.stat:
        path: /etc/fapolicyd/trust.d/ansible-logstash
      register: test_trust_after

    - name: Check the entries were left alone
      ansible.builtin.assert:
        that:
          - test_trust_after.stat.mtime == test_trust_before.stat.mtime

- name: Record entries as written for something else
  hosts: logstash
  become: true
  gather_facts: false
  vars: *test_update_vars
  tasks:
    - name: Read the trust file
      ansible.builtin.stat:
        path: /etc/fapolicyd/trust.d/ansible-logstash
      register: test_trust_before

    - name: Read what the entries were written for
      ansible.builtin.slurp:
        src: /etc/fapolicyd/ansible-logstash.ansible.json
      register: test_state

    - name: Change the recorded fingerprint
      ansible.builtin.copy:
        dest: /etc/fapolicyd/ansible-logstash.ansible.json
        content: "{{ test_state.content | b64decode | from_json | combine({'fingerprint': 'something else'}) | to_json }}"
        mode: "0644"

    - name: Apply the role
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"

    - name: Read the trust file again
      ansible.builtin.stat:
        path: /etc/fapolicyd/trust.d/ansible-logstash
      register: test_trust_after

    - name: Check the entries were rewritten
      ansible.builtin.assert:
        that:
          - test_trust_after.stat.mtime > test_trust_before.stat.mtime

---
# Not ../kvm/prepare.yml: that one also sets up the default scenario's two
# hosts, TLS files and firewalls, which this scenario does not use.
- name: Wait for cloud-init
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Wait for cloud-init to finish
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
      failed_when: false

    # The role needs the openssl CLI (see the README's requirements)
    - name: Install openssl
      ansible.builtin.dnf:
        name: openssl
        state: present

# fapolicyd with its default rules and nothing added for Ansible, which runs
# as root (see the README's fapolicyd section) or for Logstash: the role's
# trust entries are what is being tested.
- name: Run fapolicyd
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Install fapolicyd
      ansible.builtin.dnf:
        name: fapolicyd
        state: present

    - name: Start fapolicyd
      ansible.builtin.systemd_service:
        name: fapolicyd
        state: started
        enabled: true

---
# The kvm scenario on AlmaLinux 10 VMs whose /tmp, /var/tmp, /dev/shm and
# /home are mounted noexec, as the DISA STIG has them. Logstash, the plugin
# and keystore commands and the pipeline validation must all run without an
# executable /tmp. Same hosts, playbooks and inventory as ../kvm, plus a
# plugin install (internet access for rubygems.org).
#   molecule test -s kvm-noexec
role_name_check: 1

dependency:
  name: galaxy

driver:
  name: default
  options:
    managed: true

platforms:
  - name: ls-1
    image_url: https://repo.almalinux.org/almalinux/10/cloud/x86_64/images/AlmaLinux-10-GenericCloud-latest.x86_64.qcow2
    image_checksum: sha256:https://repo.almalinux.org/almalinux/10/cloud/x86_64/images/CHECKSUM
    osinfo: almalinux10
    memory_mb: 3072
    vcpus: 2
    disk_gb: 20
    groups:
      - logstash
      - firewalld
      - kvm
  - name: ls-2
    image_url: https://repo.almalinux.org/almalinux/10/cloud/x86_64/images/AlmaLinux-10-GenericCloud-latest.x86_64.qcow2
    image_checksum: sha256:https://repo.almalinux.org/almalinux/10/cloud/x86_64/images/CHECKSUM
    osinfo: almalinux10
    memory_mb: 3072
    vcpus: 2
    disk_gb: 20
    groups:
      - logstash
      - kvm

provisioner:
  name: ansible
  config_options:
    defaults:
      host_key_checking: false
    ssh_connection:
      pipelining: true
  playbooks:
    create: ../kvm/create.yml
    destroy: ../kvm/destroy.yml
    prepare: prepare.yml
    converge: ../default/converge.yml
    side_effect: ../default/side_effect.yml
    verify: verify.yml
  inventory:
    links:
      group_vars: inventory/group_vars/

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - side_effect
    - verify
    - destroy

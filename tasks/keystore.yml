---
# The Logstash keystore cannot print stored values, so the role keeps a salted
# SHA-256 of each managed value in a root-only state file to detect changes.

- name: Keystore | Check keystore file
  ansible.builtin.stat:
    path: "{{ _ls_keystore_path }}"
  register: _ls_ks_file

- name: Keystore | Read keystore state
  ansible.builtin.slurp:
    src: "{{ _ls_keystore_state_file }}"
  register: _ls_ks_state_raw
  failed_when: false

- name: Keystore | Load keystore state
  ansible.builtin.set_fact:
    _ls_ks_state: >-
      {{ (_ls_ks_state_raw.content | b64decode | from_json)
         if (_ls_ks_state_raw.content is defined and _ls_ks_file.stat.exists) else {} }}
    _ls_ks_hashes: {}

- name: Keystore | Choose checksum salt
  ansible.builtin.set_fact:
    _ls_ks_salt: >-
      {{ _ls_ks_state.salt | default(lookup('ansible.builtin.password', '/dev/null',
                                            chars=['ascii_letters', 'digits'], length=32)) }}

- name: Keystore | Compute checksums of desired entries
  ansible.builtin.set_fact:
    _ls_ks_hashes: "{{ _ls_ks_hashes | combine({item.key | lower: (_ls_ks_salt ~ item.key ~ item.value) | hash('sha256')}) }}"
  loop: "{{ _ls_keystore_desired | dict2items }}"
  no_log: true

- name: Keystore | Create keystore
  ansible.builtin.command:
    argv:
      - "{{ logstash_home }}/bin/logstash-keystore"
      - --path.settings
      - "{{ logstash_conf_dir }}"
      - create
    # Answers the "continue without password protection?" prompt
    stdin: "y"
  environment: "{{ _ls_keystore_env }}"
  register: _ls_ks_created
  when:
    - not _ls_ks_file.stat.exists
    - _ls_keystore_desired | length > 0
  no_log: "{{ logstash_no_log }}"

- name: Keystore | List entries
  ansible.builtin.command:
    argv:
      - "{{ logstash_home }}/bin/logstash-keystore"
      - --path.settings
      - "{{ logstash_conf_dir }}"
      - list
  environment: "{{ _ls_keystore_env }}"
  register: _ls_ks_list
  changed_when: false
  check_mode: false
  when: _ls_ks_file.stat.exists or _ls_ks_created is changed
  no_log: "{{ logstash_no_log }}"

- name: Keystore | Work out keystore changes
  ansible.builtin.set_fact:
    _ls_ks_current: "{{ _ls_ks_list.stdout_lines | default([]) | map('trim') | select('match', '^[A-Za-z0-9_.-]+$') | map('lower') | list }}"
    # new entries, or entries whose value differs from the recorded checksum
    _ls_ks_update: >-
      {{ (_ls_ks_hashes | dict2items | difference(_ls_ks_state.entries | default({}) | dict2items)
          | map(attribute='key') | list)
         + (_ls_ks_hashes.keys() | list
            | difference(_ls_ks_list.stdout_lines | default([]) | map('trim') | map('lower') | list)) }}

- name: Keystore | Remove changed and unmanaged entries
  ansible.builtin.command:
    argv:
      - "{{ logstash_home }}/bin/logstash-keystore"
      - --path.settings
      - "{{ logstash_conf_dir }}"
      - remove
      - "{{ item }}"
  environment: "{{ _ls_keystore_env }}"
  loop: >-
    {{ ((_ls_ks_update | intersect(_ls_ks_current))
        + ((_ls_ks_current | difference(_ls_ks_hashes.keys() | list)) if logstash_keystore_purge | bool else []))
       | unique }}
  register: _ls_ks_removed
  no_log: "{{ logstash_no_log }}"

- name: Keystore | Add new and changed entries
  ansible.builtin.command:
    argv:
      - "{{ logstash_home }}/bin/logstash-keystore"
      - --path.settings
      - "{{ logstash_conf_dir }}"
      - add
      - "{{ item.key }}"
    stdin: "{{ item.value }}"
  environment: "{{ _ls_keystore_env }}"
  loop: "{{ _ls_keystore_desired | dict2items }}"
  when: (item.key | lower) in _ls_ks_update
  register: _ls_ks_added
  no_log: "{{ logstash_no_log }}"

- name: Keystore | Record checksums
  ansible.builtin.copy:
    content: "{{ {'salt': _ls_ks_salt, 'entries': _ls_ks_hashes} | to_nice_json }}"
    dest: "{{ _ls_keystore_state_file }}"
    owner: root
    group: root
    mode: "0600"
  when: _ls_keystore_desired | length > 0 or _ls_ks_file.stat.exists

- name: Keystore | Ensure keystore permissions
  ansible.builtin.file:
    path: "{{ _ls_keystore_path }}"
    owner: root
    group: logstash
    mode: "0640"
  when: _ls_ks_file.stat.exists or _ls_ks_created is changed

- name: Keystore | Flag restart for keystore changes
  ansible.builtin.set_fact:
    _ls_restart_required: true
  when: _ls_ks_created is changed or _ls_ks_removed is changed or _ls_ks_added is changed

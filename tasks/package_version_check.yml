---
# Runs only when a package install or upgrade is about to happen. Confirms the
# pinned version exists in the package source before anything is changed; with
# Satellite this catches content views that were not published or promoted.
- name: Install | Query available Logstash versions
  ansible.builtin.command:
    argv: >-
      {{ ['dnf', '-q', 'repoquery', '--qf', '%{version}']
         + ((['--disablerepo=*'] + (_ls_package_repos | map('regex_replace', '^', '--enablerepo=') | list))
            if _ls_package_repos | length > 0 else [])
         + ['logstash'] }}
  register: _ls_available_versions
  until: _ls_available_versions is not failed
  retries: "{{ logstash_task_retries }}"
  delay: "{{ logstash_task_delay }}"
  changed_when: false
  check_mode: false

- name: Install | Verify the requested Logstash version is available
  vars:
    _ls_versions: >-
      {{ _ls_available_versions.stdout_lines | map('trim') | select('match', '^[0-9]') | unique | list }}
  ansible.builtin.assert:
    that:
      - logstash_version in _ls_versions
    fail_msg: >-
      logstash {{ logstash_version }} is not available from
      {{ {'elastic': 'repository ' ~ _ls_repo_name,
          'satellite': 'Satellite repository ' ~ logstash_satellite_repo_id,
          'none': 'the enabled repositories'}[logstash_repo_source] }} on {{ inventory_hostname }}
      (available: {{ (_ls_versions | sort | join(', ')) or 'none' }}).
      {% if logstash_repo_source == 'satellite' %}Sync the repository, then publish and promote a
      content view version that includes it to this host's lifecycle environment.{% endif %}
    quiet: true
